<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>근무 추이 판독</title>
<!--
  사람 기준치 측정용 뷰어 — tools/baseline/README.md 절차의 2단계.
  검출 결과·이상 표시·통계 정렬을 일부러 넣지 않는다. 현장 DCS 추이 화면처럼 값과 한계선만 보여 준다.
  파일은 브라우저 안에서만 읽고 어디로도 보내지 않는다(네트워크 요청 없음).
-->
<style>
:root{
  --bg:#F3F5F3; --panel:#FFFFFF; --ink:#1B221F; --muted:#5B6761; --line:#D5DBD7; --soft:#EAEEEB;
  --pen:#1F5FA8; --band:#8C9892; --warn:#B7791F; --crit:#B83227; --sel:rgba(31,95,168,.14);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101412; --panel:#171C19; --ink:#E2E8E4; --muted:#96A19B; --line:#29322D; --soft:#1F2622;
         --pen:#74AAE6; --band:#6E7A74; --warn:#D8A443; --crit:#E0685C; --sel:rgba(116,170,230,.18); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:15px;font-weight:650;margin:0}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:inherit}
button,.file{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button.primary{background:var(--pen);border-color:var(--pen);color:#fff}
button:disabled{opacity:.45;cursor:default}
.file{position:relative}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file:focus-within,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
input[type=text],input[type=time],select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.timer{font:600 20px/1 var(--mono);font-variant-numeric:tabular-nums;min-width:5.5ch}
.status{color:var(--muted);font-size:13px}
.status.bad{color:var(--crit)}
.gate{max-width:62ch;margin:48px auto;padding-inline:16px;color:var(--muted);text-align:center;text-wrap:balance}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;padding:12px 16px}
@media (max-width:880px){ main{grid-template-columns:minmax(0,1fr)} #tags{max-height:42vh} }
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.cardhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600}
#tags{max-height:calc(100vh - 110px);overflow:auto}
.tag{display:grid;grid-template-columns:74px minmax(0,1fr);grid-template-rows:auto 26px;gap:0 8px;width:100%;
  text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 12px}
.tag[aria-pressed=true]{background:var(--sel)}
.tag .code{font:600 12px/1.6 var(--mono)}
.tag .desc{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag canvas{grid-column:1 / -1;width:100%;height:26px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px}
#charts{display:flex;flex-direction:column;gap:12px}
.chart .chead{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:6px 8px 0 12px}
.chart .lim{color:var(--muted);font-size:12px}
.chart .x{margin-left:auto;padding:0 9px}
.chart canvas{display:block;width:100%;height:210px;cursor:crosshair;touch-action:none}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form .wide{grid-column:1 / -1}
#fMsg{margin:0 12px 8px}
#fList{margin:0;padding:0 12px 12px 36px}
#fList li{padding:4px 0;border-bottom:1px solid var(--soft)}
#fList button{padding:0 8px;margin-left:8px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>근무 추이 판독</h1>
  <div class="grp">
    <label class="file">파일 열기<input type="file" id="files" accept=".csv" multiple></label>
    <span id="fileInfo" class="status" role="status">shift.csv 와 tag_master.csv 를 함께 고르세요</span>
  </div>
  <div class="grp">
    <input type="text" id="tester" placeholder="이름(이니셜)" size="10" aria-label="시험자">
    <span class="timer" id="timer" aria-label="경과 시간">00:00</span>
    <button id="start" class="primary" disabled>시작</button>
    <button id="stop" disabled>종료</button>
    <button id="export" disabled>기록 내보내기</button>
    <button id="reset" hidden>새 시험</button>
  </div>
</header>

<p class="gate" id="gate">파일을 열면 준비됩니다. 「시작」을 누르는 순간부터 추이가 보이고 시간이 흐릅니다.</p>

<main id="main" hidden>
  <aside class="card">
    <div class="cardhead">태그 <span class="status">누르면 오른쪽에 쌓입니다 (최대 4개)</span></div>
    <div id="tags"></div>
  </aside>
  <section>
    <div class="nav card">
      <button id="full">전체 12시간</button>
      <button id="left" aria-label="앞으로">◀</button>
      <button id="right" aria-label="뒤로">▶</button>
      <button id="out">축소</button>
      <span id="winLabel" class="mono"></span>
      <span class="status">끌어서 확대 · 두 번 눌러 전체</span>
    </div>
    <div id="charts"></div>
    <div class="card">
      <div class="cardhead">발견 기록 <span class="status">이상이라고 판단할 때마다 한 줄씩. 발견한 시각(경과)이 자동으로 붙습니다.</span></div>
      <div class="form">
        <label>태그<select id="fTag"></select></label>
        <label>시작<input type="time" id="fStart" step="1"></label>
        <label>끝<input type="time" id="fEnd" step="1"></label>
        <button id="fWin">보이는 구간 넣기</button>
        <label>종류<select id="fKind"><option value="">고르세요</option></select></label>
        <label>중요도<select id="fSev"><option>상</option><option selected>중</option><option>하</option></select></label>
        <label class="wide">메모<input type="text" id="fNote" placeholder="무엇을 봤는지 한 줄"></label>
        <button id="fAdd" class="primary">기록 추가</button>
      </div>
      <p id="fMsg" class="status" role="status"></p>
      <ol id="fList"></ol>
    </div>
  </section>
</main>

<script>
(function(){
'use strict';
// 엔진이 이벤트에 붙이는 종류 이름 그대로 — 채점(tools/score.py)이 같은 이름으로 추세형·알람을 가른다.
var KINDS = [
  ['이탈', '순간적으로 크게 벗어났다가 곧 돌아옴'], ['헌팅', '흔들림(변동폭)이 평소보다 커짐'],
  ['드리프트', '한 방향으로 서서히 움직임'], ['레벨시프트', '한 번 옮겨간 뒤 그 수준에 머묾'],
  ['고착', '값이 움직이지 않음'], ['임계근접', '알람은 안 울렸지만 한계선 가까이 머묾'],
  ['상관이탈', '함께 움직이던 태그와 따로 놂'],
  ['H 초과', 'H 한계를 넘음'], ['HH 초과', 'HH 한계를 넘음'], ['L 미달', 'L 한계 아래'], ['LL 미달', 'LL 한계 아래'],
  ['기타', '위에 없는 이상']
];
var MAX_CHARTS = 4;
var $ = function(id){ return document.getElementById(id); };
var S = { name:'', sha:'', masterSha:'', shiftId:'', t0:0, step:2, N:0, tags:[], data:{}, spec:{},
          startMs:0, endMs:0, findings:[], seq:1, win:[0,0], sel:[], hover:-1, drag:null };

// CSV 의 시각은 시간대 없는 벽시계 값이다. UTC 로 읽고 UTC 로 써서 PC 시간대와 무관하게 만든다.
function parseTs(s){ return Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10), +s.slice(11,13), +s.slice(14,16), +s.slice(17,19)); }
function isoLocal(ms){ return new Date(ms).toISOString().slice(0,19); }
function hms(ms){ return new Date(ms).toISOString().slice(11,19); }
function msAt(i){ return S.t0 + i*S.step*1000; }
function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(b){ return (b<16?'0':'')+b.toString(16); }).join(''); }
function say(el, t, bad){ el.textContent = t; el.classList.toggle('bad', !!bad); }

function csvRow(line){
  var out = [], cur = '', q = false;
  for (var k = 0; k < line.length; k++){
    var ch = line[k];
    if (q){ if (ch === '"'){ if (line[k+1] === '"'){ cur += '"'; k++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === ','){ out.push(cur); cur = ''; } else cur += ch;
  }
  out.push(cur); return out;
}
function parseMaster(text){
  var lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(Boolean), head = csvRow(lines[0]);
  var col = function(r, n){ var i = head.indexOf(n); return i < 0 ? '' : r[i]; };
  var num = function(v){ return v === '' || v == null || isNaN(+v) ? null : +v; };
  lines.slice(1).forEach(function(l){
    var r = csvRow(l);
    S.spec[col(r,'tag')] = { desc:col(r,'description'), unit:col(r,'unit'), lo:num(col(r,'normal_lo')), hi:num(col(r,'normal_hi')),
                             LL:num(col(r,'LL')), L:num(col(r,'L')), H:num(col(r,'H')), HH:num(col(r,'HH')) };
  });
}
function parseShift(text){
  var pos = text.indexOf('\n') + 1, first = text.slice(pos, text.indexOf(',', pos));
  S.t0 = parseTs(first);
  var p2 = pos, ts2 = first;
  while (ts2 === first && p2 > 0 && p2 < text.length){ p2 = text.indexOf('\n', p2) + 1; ts2 = text.slice(p2, text.indexOf(',', p2)); }
  S.step = (parseTs(ts2) - S.t0) / 1000;
  if (!(S.step > 0)) throw new Error('시각 간격을 알 수 없습니다');
  S.N = Math.round(12*3600 / S.step);
  var prev = '', i = -1;
  while (pos < text.length){
    var nl = text.indexOf('\n', pos); if (nl < 0) nl = text.length;
    var c1 = text.indexOf(',', pos), c2 = c1 < 0 ? -1 : text.indexOf(',', c1 + 1);
    if (c1 > pos && c2 > c1 && c2 < nl){
      var ts = text.slice(pos, c1);
      if (ts !== prev){ prev = ts; i = Math.round((parseTs(ts) - S.t0) / 1000 / S.step); }
      var tag = text.slice(c1 + 1, c2), arr = S.data[tag];
      if (!arr){ arr = S.data[tag] = new Float32Array(S.N).fill(NaN); S.tags.push(tag); }
      if (i >= 0 && i < S.N) arr[i] = parseFloat(text.slice(c2 + 1, nl));
    }
    pos = nl + 1;
  }
  var h = new Date(S.t0).getUTCHours(), day = isoLocal(S.t0).slice(0,10);
  S.shiftId = (h >= 6 && h < 18) ? day + '-day'
            : h >= 18 ? day + '-night' : isoLocal(S.t0 - 86400000).slice(0,10) + '-night';
  S.win = [0, S.N];
}

/* ── 저장: 새로고침해도 기록·시작 시각이 남게 (같은 파일일 때만) ── */
// 태그 마스터 지문도 키에 넣는다 — 다른 한계선으로 쓰던 기록이 정본을 열었을 때 이어져 정본 지문을 달고 나가지 않게 (Codex)
function storeKey(){ return 'engra_baseline_' + S.sha + '_' + S.masterSha; }
function persist(){
  try { localStorage.setItem(storeKey(), JSON.stringify({ startMs:S.startMs, endMs:S.endMs, findings:S.findings, seq:S.seq, tester:$('tester').value })); } catch(e){}
}
function restore(){
  try {
    var o = JSON.parse(localStorage.getItem(storeKey()) || 'null');
    if (!o) return false;
    S.startMs = o.startMs || 0; S.endMs = o.endMs || 0; S.findings = o.findings || []; S.seq = o.seq || 1; $('tester').value = o.tester || '';
    return !!S.startMs;
  } catch(e){ return false; }
}

/* ── 그리기 ── */
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function fmtV(v, span){ var d = span < 0.1 ? 4 : span < 1 ? 3 : span < 10 ? 2 : span < 100 ? 1 : 0; return v.toFixed(d); }
function yRange(tag, a, b){
  var arr = S.data[tag], mn = Infinity, mx = -Infinity, sp = S.spec[tag];
  for (var k = a; k < b; k++){ var v = arr[k]; if (v === v){ if (v < mn) mn = v; if (v > mx) mx = v; } }
  if (sp){ [sp.lo, sp.hi].forEach(function(v){ if (v != null){ mn = Math.min(mn, v); mx = Math.max(mx, v); } }); }
  if (!isFinite(mn)){ mn = 0; mx = 1; }
  if (mx - mn < 1e-9){ mn -= 1; mx += 1; }
  var pad = (mx - mn) * 0.08;
  return [mn - pad, mx + pad];
}
function pickTick(sec){ var c = [10,30,60,300,600,1800,3600,7200]; for (var i = 0; i < c.length; i++) if (sec / c[i] <= 12) return c[i]; return 7200; }

function draw(cv, tag, spark){
  var W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
  var dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  var g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  var a = spark ? 0 : S.win[0], b = spark ? S.N : S.win[1], span = b - a;
  var L = spark ? 0 : 58, R = spark ? 0 : 10, T = spark ? 2 : 8, B = spark ? 2 : 22, pw = W - L - R, ph = H - T - B;
  var yr = yRange(tag, a, b), Y = function(v){ return T + ph - (v - yr[0]) / (yr[1] - yr[0]) * ph; };
  var arr = S.data[tag], mono = '11px ' + css('--mono');
  if (!spark){
    g.lineWidth = 1; g.font = mono;
    var tick = pickTick(span * S.step), t0s = S.t0/1000 + a*S.step, t1s = S.t0/1000 + b*S.step;
    for (var t = Math.ceil(t0s / tick) * tick; t < t1s; t += tick){
      var x = Math.round(L + (t - t0s) / (span * S.step) * pw) + .5;
      g.strokeStyle = css('--line'); g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke();
      g.fillStyle = css('--muted'); var lab = hms(t*1000).slice(0, tick >= 60 ? 5 : 8);
      g.fillText(lab, x - g.measureText(lab).width/2, H - 6);
    }
    g.fillStyle = css('--muted');
    [yr[1], (yr[0]+yr[1])/2, yr[0]].forEach(function(v, j){ g.fillText(fmtV(v, yr[1]-yr[0]), 2, T + 10 + j*(ph-14)/2); });
    var sp = S.spec[tag];
    if (sp){
      var marks = {};   // 정상 상한과 H 처럼 같은 값에 선이 둘이면 글자가 겹친다 — 값마다 이름을 모아 한 번만 쓴다
      [['lo','--band',[4,4],'정상'],['hi','--band',[4,4],'정상'],['L','--warn',[],'L'],['H','--warn',[],'H'],['LL','--crit',[],'LL'],['HH','--crit',[],'HH']].forEach(function(z){
        var v = sp[z[0]]; if (v == null || v < yr[0] || v > yr[1]) return;
        var yy = Math.round(Y(v)) + .5; g.strokeStyle = css(z[1]); g.setLineDash(z[2]);
        g.beginPath(); g.moveTo(L, yy); g.lineTo(L + pw, yy); g.stroke(); g.setLineDash([]);
        var m = marks[v] || (marks[v] = { y:yy, names:[], color:'' }); m.names.push(z[3]); m.color = z[1];
      });
      Object.keys(marks).forEach(function(k){
        var m = marks[k], lb = m.names.join('·') + ' ' + k;
        g.fillStyle = css(m.color); g.fillText(lb, L + pw - g.measureText(lb).width - 4, m.y - 3);
      });
    }
    if (S.drag && S.drag.cv === cv){
      g.fillStyle = css('--sel'); var dx0 = Math.min(S.drag.x0, S.drag.x1), dx1 = Math.max(S.drag.x0, S.drag.x1);
      g.fillRect(dx0, T, dx1 - dx0, ph);
    }
  }
  g.strokeStyle = g.fillStyle = css('--pen'); g.lineWidth = spark ? 1 : 1.25;
  if (span <= pw){
    g.beginPath(); var down = false;
    for (var k = a; k < b; k++){
      var v = arr[k], x2 = L + (k - a + .5) / span * pw;
      if (v !== v){ down = false; continue; }
      if (down) g.lineTo(x2, Y(v)); else { g.moveTo(x2, Y(v)); down = true; }
    }
    g.stroke();
  } else {
    // 픽셀 한 칸에 여러 점이 들어가면 최소~최대를 세로로 칠한다 — 3초짜리 튐도 12시간 화면에서 사라지지 않는다
    var pmn = null, pmx = null;
    for (var px = 0; px < pw; px++){
      var k0 = a + Math.floor(px * span / pw), k1 = Math.max(k0 + 1, a + Math.floor((px + 1) * span / pw));
      var mn = Infinity, mx = -Infinity;
      for (var kk = k0; kk < k1 && kk < b; kk++){ var vv = arr[kk]; if (vv === vv){ if (vv < mn) mn = vv; if (vv > mx) mx = vv; } }
      if (mn === Infinity){ pmn = pmx = null; continue; }
      var lo = pmx !== null ? Math.min(mn, pmx) : mn, hi = pmn !== null ? Math.max(mx, pmn) : mx;
      var yt = Y(hi), yb = Y(lo); g.fillRect(L + px, yt, 1, Math.max(1, yb - yt));
      pmn = mn; pmx = mx;
    }
  }
  if (!spark && S.hover >= a && S.hover < b){
    var hx = Math.round(L + (S.hover - a + .5) / span * pw) + .5, hv = arr[S.hover], sp2 = S.spec[tag];
    g.strokeStyle = css('--ink'); g.beginPath(); g.moveTo(hx, T); g.lineTo(hx, T + ph); g.stroke();
    g.fillStyle = css('--ink'); g.font = '600 ' + mono;
    var txt = hms(msAt(S.hover)) + '  ' + (hv === hv ? fmtV(hv, yr[1]-yr[0]) : '값 없음') + (sp2 && sp2.unit ? ' ' + sp2.unit : '');
    g.fillText(txt, Math.min(hx + 6, L + pw - g.measureText(txt).width - 2), T + 12);
  }
}

var raf = 0;
function redraw(){ if (raf) return; raf = requestAnimationFrame(function(){ raf = 0;
  Array.prototype.forEach.call($('charts').querySelectorAll('canvas'), function(cv){ draw(cv, cv.dataset.tag, false); });
  var a = S.win[0], b = S.win[1], min = Math.round((b - a) * S.step / 60);
  $('winLabel').textContent = hms(msAt(a)) + ' ~ ' + hms(msAt(b) - 1000) + '  (' + (min >= 60 ? (min/60).toFixed(1) + '시간' : min + '분') + ')';
}); }

function limText(sp){
  if (!sp) return '태그 마스터에 없는 태그';
  var p = [];
  if (sp.lo != null || sp.hi != null) p.push('정상 ' + (sp.lo != null ? sp.lo : '—') + '~' + (sp.hi != null ? sp.hi : '—'));
  ['LL','L','H','HH'].forEach(function(k){ if (sp[k] != null) p.push(k + ' ' + sp[k]); });
  return p.join(' · ');
}
function renderTags(){
  var box = $('tags'); box.innerHTML = '';
  S.tags.forEach(function(tag){
    var sp = S.spec[tag], b = document.createElement('button');
    b.className = 'tag'; b.dataset.tag = tag; b.setAttribute('aria-pressed', S.sel.indexOf(tag) >= 0);
    b.innerHTML = '<span class="code"></span><span class="desc"></span><canvas></canvas>';
    b.querySelector('.code').textContent = tag;
    b.querySelector('.desc').textContent = sp ? sp.desc + (sp.unit ? ' · ' + sp.unit : '') : '';
    box.appendChild(b);
  });
  Array.prototype.forEach.call(box.querySelectorAll('canvas'), function(cv){ draw(cv, cv.parentNode.dataset.tag, true); });
}
function renderCharts(){
  var box = $('charts'); box.innerHTML = '';
  S.sel.forEach(function(tag){
    var sp = S.spec[tag], c = document.createElement('div');
    c.className = 'chart card';
    c.innerHTML = '<div class="chead"><b class="mono"></b><span class="d"></span><span class="lim"></span><button class="x" aria-label="닫기">×</button></div><canvas></canvas>';
    c.querySelector('b').textContent = tag;
    c.querySelector('.d').textContent = sp ? sp.desc + (sp.unit ? ' (' + sp.unit + ')' : '') : '';
    c.querySelector('.lim').textContent = limText(sp);
    c.querySelector('.x').onclick = function(){ toggle(tag); };
    var cv = c.querySelector('canvas'); cv.dataset.tag = tag; bindChart(cv);
    box.appendChild(c);
  });
  Array.prototype.forEach.call($('tags').children, function(b){ b.setAttribute('aria-pressed', S.sel.indexOf(b.dataset.tag) >= 0); });
  redraw();
}
function toggle(tag){
  var i = S.sel.indexOf(tag);
  if (i >= 0) S.sel.splice(i, 1);
  else { S.sel.push(tag); if (S.sel.length > MAX_CHARTS) S.sel.shift(); $('fTag').value = tag; }
  renderCharts();
}
function idxAt(cv, clientX){
  var r = cv.getBoundingClientRect(), pw = r.width - 58 - 10, span = S.win[1] - S.win[0];
  return Math.max(S.win[0], Math.min(S.win[1] - 1, S.win[0] + Math.floor((clientX - r.left - 58) / pw * span)));
}
function bindChart(cv){
  cv.addEventListener('pointerdown', function(e){ var x = e.clientX - cv.getBoundingClientRect().left; S.drag = { cv:cv, x0:x, x1:x }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function(e){
    S.hover = idxAt(cv, e.clientX);
    if (S.drag && S.drag.cv === cv) S.drag.x1 = e.clientX - cv.getBoundingClientRect().left;
    redraw();
  });
  cv.addEventListener('pointerup', function(e){
    var d = S.drag; S.drag = null; if (!d) return;
    if (Math.abs(d.x1 - d.x0) > 4){
      var r = cv.getBoundingClientRect(), i0 = idxAt(cv, r.left + Math.min(d.x0, d.x1)), i1 = idxAt(cv, r.left + Math.max(d.x0, d.x1)) + 1;
      if (i1 - i0 >= 10) S.win = [i0, i1];
    }
    redraw();
  });
  cv.addEventListener('pointerleave', function(){ S.hover = -1; redraw(); });
  cv.addEventListener('dblclick', function(){ S.win = [0, S.N]; redraw(); });
}
function pan(dir){
  var a = S.win[0], b = S.win[1], w = b - a, d = Math.round(w / 2) * dir;
  d = Math.max(-a, Math.min(S.N - b, d)); S.win = [a + d, b + d]; redraw();
}
function zoomOut(){
  var a = S.win[0], b = S.win[1], w = Math.min(S.N, (b - a) * 2), m = Math.round((a + b) / 2);
  var na = Math.max(0, Math.min(S.N - w, m - Math.round(w / 2))); S.win = [na, na + w]; redraw();
}

/* ── 발견 기록 ── */
function timeToMs(v){
  if (!v) return null;
  var p = v.split(':').map(Number), sod = p[0]*3600 + p[1]*60 + (p[2] || 0), d0 = new Date(S.t0);
  var off = (sod - (d0.getUTCHours()*3600 + d0.getUTCMinutes()*60 + d0.getUTCSeconds()) + 86400) % 86400;
  // 근무 끝 시각(주간 18:00:00·야간 06:00:00)도 끝으로 적을 수 있어야 한다 — 그 시각에 끝나는 사건이 있다
  return off <= S.N * S.step ? S.t0 + off*1000 : null;
}
function renderFindings(){
  var ol = $('fList'); ol.innerHTML = '';
  S.findings.forEach(function(f){
    var li = document.createElement('li'), del = document.createElement('button');
    li.textContent = Math.round(f.found_at_sec / 60) + '분 · ' + f.tag + ' ' + f.kind + ' ' + f.start.slice(11) + '~' + f.end.slice(11)
                   + ' · ' + f.severity + (f.note ? ' · ' + f.note : '');
    del.textContent = '지우기'; del.disabled = !!S.endMs;
    del.onclick = function(){ S.findings = S.findings.filter(function(x){ return x.id !== f.id; }); persist(); renderFindings(); };
    li.appendChild(del); ol.appendChild(li);
  });
}
function addFinding(){
  var s = timeToMs($('fStart').value), e = timeToMs($('fEnd').value), tag = $('fTag').value, kind = $('fKind').value;
  if (!tag || !kind) return say($('fMsg'), '태그와 종류를 고르세요.', true);
  if (s === null || e === null) return say($('fMsg'), '시작·끝 시각이 이 근무(12시간) 안에 있어야 합니다.', true);
  if (e < s) return say($('fMsg'), '끝이 시작보다 앞섭니다.', true);
  var f = { id:S.seq++, tag:tag, kind:kind, severity:$('fSev').value, start:isoLocal(s), end:isoLocal(e),
            note:$('fNote').value.trim(), found_at_sec:Math.round((Date.now() - S.startMs) / 1000) };
  S.findings.push(f); persist(); renderFindings();
  $('fNote').value = ''; say($('fMsg'), '#' + f.id + ' 기록했습니다.');
}

/* ── 진행 ── */
function setRunning(){
  var on = !!S.startMs && !S.endMs;
  $('main').hidden = !S.startMs; $('gate').hidden = !!S.startMs;
  $('start').disabled = !S.sha || !!S.startMs; $('stop').disabled = !on;
  // 내보내기는 종료 뒤에만 — 끝나지 않은 기록은 채점기(compare.py)도 받지 않는다
  $('export').disabled = !S.endMs; $('reset').hidden = !S.endMs;
  ['fTag','fStart','fEnd','fWin','fKind','fSev','fNote','fAdd'].forEach(function(id){ $(id).disabled = !on; });
  if (S.endMs) say($('fMsg'), '종료했습니다. 「기록 내보내기」로 파일을 저장하세요.');
}
function tick(){
  if (!S.startMs) return;
  var s = Math.floor(((S.endMs || Date.now()) - S.startMs) / 1000);
  $('timer').textContent = (s >= 3600 ? Math.floor(s/3600) + ':' : '') + ('0' + Math.floor(s/60 % 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2);
}
function exportRecord(){
  if (!S.endMs) return;
  var rec = { format:'engra-baseline-findings/1', shift_id:S.shiftId, csv_name:S.name, csv_sha256:S.sha, tag_master_sha256:S.masterSha,
              tester:$('tester').value.trim(), started_at:new Date(S.startMs).toISOString(), ended_at:new Date(S.endMs).toISOString(),
              elapsed_sec:Math.round((S.endMs - S.startMs) / 1000), findings:S.findings };
  var u = URL.createObjectURL(new Blob([JSON.stringify(rec, null, 2)], { type:'application/json' })), a = document.createElement('a');
  a.href = u; a.download = '기록_' + S.shiftId + '_' + (rec.tester || '익명') + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 2000);
}
// 되돌릴 수 없는 버튼은 두 번 눌러야 한다 — 확인 창(confirm)은 시험 흐름을 끊는다
function twoStep(btn, armedLabel, act){
  var label = btn.textContent, armed = 0;
  btn.onclick = function(){
    if (!armed){ armed = setTimeout(function(){ armed = 0; btn.textContent = label; }, 3000); btn.textContent = armedLabel; return; }
    clearTimeout(armed); armed = 0; btn.textContent = label; act();
  };
}

$('files').addEventListener('change', async function(){
  var input = this, files = Array.prototype.slice.call(input.files); if (!files.length) return;
  try {
    say($('fileInfo'), '읽는 중…');
    var shift = null, master = null;
    for (var i = 0; i < files.length; i++){
      var head = await files[i].slice(0, 120).text();
      if (/^﻿?timestamp,tag,value/.test(head)) shift = files[i];
      else if (/^﻿?tag,description,unit/.test(head)) master = files[i];
    }
    if (!shift) throw new Error('timestamp,tag,value 로 시작하는 근무 CSV 가 없습니다');
    // 한계선 없이 한 시험은 엔진과 조건이 달라 채점기가 받지 않는다 — 여기서 먼저 막는다
    if (!master) throw new Error('tag_master.csv 를 함께 고르세요 (두 파일을 한 번에 선택)');
    if (!window.crypto || !crypto.subtle) throw new Error('이 브라우저에서는 파일 지문(SHA-256)을 낼 수 없습니다 — Chrome 으로 여세요');
    var mbuf = await master.arrayBuffer();
    S.masterSha = hex(await crypto.subtle.digest('SHA-256', mbuf));
    S.spec = {}; parseMaster(new TextDecoder('utf-8').decode(mbuf));
    var buf = await shift.arrayBuffer();
    S.sha = hex(await crypto.subtle.digest('SHA-256', buf)); S.name = shift.name;
    S.tags = []; S.data = {}; parseShift(new TextDecoder('utf-8').decode(buf));
    $('fTag').innerHTML = '';
    S.tags.forEach(function(t){ var o = document.createElement('option'); o.value = t; o.textContent = t + (S.spec[t] ? ' ' + S.spec[t].desc : ''); $('fTag').appendChild(o); });
    var resumed = restore();
    say($('fileInfo'), S.name + ' · ' + S.shiftId + ' · ' + S.tags.length + '태그'
        + (!resumed ? '' : S.endMs ? ' · 이 파일로 끝낸 기록을 엽니다 — 새로 하려면 「새 시험」' : ' · 진행 중이던 기록을 이어서 엽니다'));
    input.disabled = true;
    setRunning();
    if (resumed){ S.sel = [S.tags[0]]; renderTags(); renderCharts(); renderFindings(); tick(); }
  } catch (err){ input.value = ''; say($('fileInfo'), '열기 실패 — ' + err.message, true); }
});
$('start').onclick = function(){
  S.startMs = Date.now(); persist(); setRunning();
  S.sel = [S.tags[0]]; renderTags(); renderCharts(); renderFindings(); tick();
};
twoStep($('stop'), '한 번 더 누르면 종료', function(){ S.endMs = Date.now(); persist(); setRunning(); renderFindings(); tick(); });
twoStep($('reset'), '기록이 지워집니다 — 한 번 더', function(){
  try { localStorage.removeItem(storeKey()); } catch(e){}
  S.startMs = 0; S.endMs = 0; S.findings = []; S.seq = 1; S.sel = []; S.win = [0, S.N];
  $('tester').value = ''; $('timer').textContent = '00:00'; $('charts').innerHTML = ''; say($('fMsg'), '');
  // 앞 시험에서 쓰다 만 입력이 다음 시험 기록에 섞이지 않게 입력칸도 비운다 (Codex)
  ['fStart','fEnd','fKind','fNote'].forEach(function(id){ $(id).value = ''; }); $('fSev').value = '중';
  say($('fileInfo'), S.name + ' · ' + S.shiftId + ' · ' + S.tags.length + '태그 · 새 시험 준비됨');
  renderFindings(); setRunning();
});
$('export').onclick = exportRecord;
$('tester').addEventListener('change', function(){ if (S.sha) persist(); });
$('tags').addEventListener('click', function(e){ var b = e.target.closest('.tag'); if (b) toggle(b.dataset.tag); });
$('full').onclick = function(){ S.win = [0, S.N]; redraw(); };
$('left').onclick = function(){ pan(-1); };
$('right').onclick = function(){ pan(1); };
$('out').onclick = zoomOut;
$('fWin').onclick = function(){ $('fStart').value = hms(msAt(S.win[0])); $('fEnd').value = hms(msAt(S.win[1]) - 1000); };
$('fAdd').onclick = addFinding;
KINDS.forEach(function(k){ var o = document.createElement('option'); o.value = k[0]; o.textContent = k[0] + ' — ' + k[1]; $('fKind').appendChild(o); });
window.addEventListener('resize', function(){ if (!S.startMs) return; renderTags(); redraw(); });
setInterval(tick, 1000);
setRunning();
})();
</script>
</body>
